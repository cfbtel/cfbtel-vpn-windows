name: Build and release CFBTEL VPN for Windows

# Publishing = change Number in version/version.go on main and push (or run this workflow by hand).
# Builds x86/amd64/arm64 on Windows, signs the programs and MSIs with CFBTEL's code-signing certificate,
# signs latest.sig with CFBTEL's release key, and creates GitHub release vX.Y.Z.
# The app's updater reads releases/latest/download/latest.sig, so only the latest full release is offered.
# Without the code-signing secrets the build is published as a pre-release (installs fine, no auto-update).
#
# (WixUI_Minimal sets ARPNOMODIFY itself.)
# Secrets: CFBTEL_RELEASE_KEY (releasesign private key), CFBTEL_PORTAL_URL (https://<staff VPN page host>).
# Code signing, either:
#   Microsoft Artifact Signing (recommended) - repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID,
#     AZURE_SUBSCRIPTION_ID (an Entra app with a GitHub federated credential and the
#     "Artifact Signing Certificate Profile Signer" role), ARTIFACT_SIGNING_ENDPOINT (e.g. https://wus2.codesigning.azure.net/),
#     ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE, CFBTEL_SIGNER (the certificate's name = the validated
#     organization name, exactly as in the certificate subject preview); or
#   a .pfx certificate - secrets CFBTEL_CODESIGN_PFX (base64) and CFBTEL_CODESIGN_PASSWORD.
# Actions are pinned to commit SHAs (organization policy).
# Release key: made with tools/releasesign (or cfbtel-release-keygen.html); public key in updater/constants.go.

on:
  push:
    branches: [main]
    paths:
      - version/version.go
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Azure sign-in for Artifact Signing (OpenID Connect, no stored Azure secret)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CFBTEL_PORTAL_URL: ${{ secrets.CFBTEL_PORTAL_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: v
        shell: pwsh
        run: |
          $n = (Select-String -Path version/version.go -Pattern 'Number\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          "number=$n" >> $env:GITHUB_OUTPUT
          gh release view "v$n" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$n exists: nothing to do." } else { "exists=false" >> $env:GITHUB_OUTPUT }
          if (-not $env:CFBTEL_PORTAL_URL) { Write-Host "::warning::CFBTEL_PORTAL_URL secret is not set: Sign in won't know the staff VPN page." }
          exit 0

      - name: Release key matches the app
        shell: pwsh
        env:
          CFBTEL_RELEASE_KEY: ${{ secrets.CFBTEL_RELEASE_KEY }}
        run: |
          if (-not $env:CFBTEL_RELEASE_KEY) { throw "CFBTEL_RELEASE_KEY secret is not set" }
          $pub = (& go run ./tools/releasesign pubkey).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $inApp = (Select-String -Path updater/constants.go -Pattern 'releasePublicKeyBase64\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Release public key (secret): $pub"
          Write-Host "Release public key (app):    $inApp"
          if ($pub -ne $inApp) { throw "The CFBTEL_RELEASE_KEY secret doesn't match updater/constants.go. Put the public key above into updater/constants.go." }

      - name: Azure sign-in (Artifact Signing)
        if: steps.v.outputs.exists == 'false' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Artifact Signing
        id: azsign
        if: steps.v.outputs.exists == 'false' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          AS_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          AS_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          AS_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          SIGNER: ${{ vars.CFBTEL_SIGNER }}
        run: |
          if (-not $env:SIGNER) { throw "Set the CFBTEL_SIGNER variable to the certificate's name (the validated organization name)." }
          # Microsoft's signtool plug-in (Microsoft.ArtifactSigning.Client 1.0.151), checked by hash.
          $pkg = Join-Path $env:RUNNER_TEMP 'artifactsigning.nupkg'
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.151/microsoft.artifactsigning.client.1.0.151.nupkg -OutFile $pkg
          if ((Get-FileHash $pkg -Algorithm SHA256).Hash -ne '35375A4BC4E1102DA729FC3D8D9925F774C3BAAE6B8B7FF6398D948CA9AB0D8A') { throw "Artifact Signing client package hash mismatch" }
          $dir = Join-Path $env:RUNNER_TEMP 'artifactsigning'
          Expand-Archive $pkg $dir -Force
          $dlib = Join-Path $dir 'bin\x64\Azure.CodeSigning.Dlib.dll'
          $meta = Join-Path $env:RUNNER_TEMP 'artifactsigning.json'
          @{ Endpoint = $env:AS_ENDPOINT; CodeSigningAccountName = $env:AS_ACCOUNT; CertificateProfileName = $env:AS_PROFILE; ExcludeCredentials = @('ManagedIdentityCredential','EnvironmentCredential','WorkloadIdentityCredential','SharedTokenCacheCredential','VisualStudioCredential','VisualStudioCodeCredential','AzurePowerShellCredential','AzureDeveloperCliCredential','InteractiveBrowserCredential') } | ConvertTo-Json | Set-Content -Encoding utf8 $meta
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          # build.bat and installer\build.bat call sign.bat, which sets the signing options.
          # The signing plug-in gets its Azure token from the Azure CLI (az.cmd). build.bat limits PATHEXT to .exe,
          # so allow .cmd and put the CLI on PATH; fetch the token now so it's cached for the whole build.
          $az = Split-Path (Get-Command az).Source
          az account get-access-token --resource https://codesigning.azure.net --output none
          if ($LASTEXITCODE -ne 0) { throw "Couldn't get an Artifact Signing token from Azure" }
          "@set SigningProvider=/dlib `"$dlib`" /dmdf `"$meta`"`r`n@set TimestampServer=http://timestamp.acs.microsoft.com`r`n@set PATH=$($signtool.DirectoryName);$az;%PATH%`r`n@set PATHEXT=%PATHEXT%;.CMD;.BAT" | Set-Content -Encoding ascii sign.bat
          "CFBTEL_SIGNER=$env:SIGNER" >> $env:GITHUB_ENV
          "CFBTEL_SIGNED=true" >> $env:GITHUB_ENV
          Write-Host "Signing with Artifact Signing as: $env:SIGNER"

      - name: Code-signing certificate
        id: cert
        if: steps.v.outputs.exists == 'false' && vars.ARTIFACT_SIGNING_ACCOUNT == ''
        shell: pwsh
        env:
          PFX: ${{ secrets.CFBTEL_CODESIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.CFBTEL_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { Write-Host "::warning::No code signing set up: publishing an unsigned pre-release."; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($path, $env:PFX_PASSWORD)
          $cn = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          Write-Host "Signing as: $cn (expires $($cert.NotAfter))"
          "CFBTEL_SIGNER=$cn" >> $env:GITHUB_ENV
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          # build.bat and installer\build.bat call sign.bat, which sets the signing options.
          "@set SigningProvider=/f `"$path`" /p `"%CFBTEL_CODESIGN_PASSWORD%`"`r`n@set TimestampServer=http://timestamp.digicert.com`r`n@set PATH=$($signtool.DirectoryName);%PATH%" | Set-Content -Encoding ascii sign.bat
          "CFBTEL_SIGNED=true" >> $env:GITHUB_ENV

      - name: Build programs
        if: steps.v.outputs.exists == 'false'
        shell: cmd
        env:
          CFBTEL_CODESIGN_PASSWORD: ${{ secrets.CFBTEL_CODESIGN_PASSWORD }}
        run: call build.bat

      - name: Build installers
        if: steps.v.outputs.exists == 'false'
        shell: cmd
        env:
          CFBTEL_CODESIGN_PASSWORD: ${{ secrets.CFBTEL_CODESIGN_PASSWORD }}
        run: call installer\build.bat

      - name: Sign the update list
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        env:
          CFBTEL_RELEASE_KEY: ${{ secrets.CFBTEL_RELEASE_KEY }}
        run: |
          if (-not $env:CFBTEL_RELEASE_KEY) { throw "CFBTEL_RELEASE_KEY secret is not set" }
          $env:GOROOT = "$PWD\.deps"; $env:GOOS = "windows"
          & .\.deps\bin\go.exe run ./tools/releasesign sign installer\dist\latest.sig (Get-ChildItem installer\dist\cfbtelvpn-*.msi).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content installer\dist\latest.sig | Select-Object -Skip 2

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        run: |
          $n = "${{ steps.v.outputs.number }}"
          $files = (Get-ChildItem installer\dist\cfbtelvpn-*.msi).FullName + "installer\dist\latest.sig"
          $notes = "CFBTEL VPN for Windows $n (based on WireGuard for Windows 1.1.1).`n`nDownload **cfbtelvpn-amd64-$n.msi** for most PCs (arm64 for ARM PCs). Installed copies update themselves."
          $extra = @()
          if ($env:CFBTEL_SIGNED -ne "true") { $extra += "--prerelease"; $notes += "`n`n> Unsigned test build: Windows SmartScreen will warn, and automatic updates are off." }
          gh release create "v$n" @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "CFBTEL VPN $n" --notes $notes @extra
